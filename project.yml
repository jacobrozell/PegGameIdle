name: PegGameIdle
options:
  bundleIdPrefix: com.jacobrozell
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

# Pure domain logic is a local Swift package so it builds/tests on CI without a
# simulator. The app target links it.
packages:
  PegGameDomain:
    path: .

settings:
  base:
    DEVELOPMENT_TEAM: 7JT2JB89AV
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

targets:
  PegGameIdle:
    type: application
    platform: iOS
    sources:
      - App
      - Features
      - DesignSystem
      - Data
      - Support
      - Resources
    dependencies:
      - package: PegGameDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.peggameidle
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Hosted unit tests for app-layer logic (view models, drag, interaction).
  # Fast — runs in the simulator without driving the UI.
  PegGameIdleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/Unit
    dependencies:
      - target: PegGameIdle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.peggameidle.unittests

  PegGameIdleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UI
    dependencies:
      - target: PegGameIdle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.peggameidle.uitests

schemes:
  # CI scheme: fast feedback. Pure logic also runs via `swift test`; this scheme
  # builds the app and runs the hosted unit tests (core features + drag).
  PegGameIdleCI:
    build:
      targets:
        PegGameIdle: all
        PegGameIdleTests: [test]
        PegGameIdleUITests: [test]
    test:
      targets:
        - PegGameIdleTests
        - PegGameIdleUITests
