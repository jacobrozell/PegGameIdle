name: PegGameIdle
options:
  bundleIdPrefix: com.jacobrozell
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

# Pure domain logic is a local Swift package so it builds/tests on CI without a
# simulator. The app target links it.
packages:
  PegGameDomain:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

targets:
  PegGameIdle:
    type: application
    platform: iOS
    sources:
      - App
      - Features
      - DesignSystem
      - Data
      - Support
      - Resources
    dependencies:
      - package: PegGameDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.peggameidle
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PegGameIdleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UI
    dependencies:
      - target: PegGameIdle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.peggameidle.uitests

schemes:
  # CI scheme: fast feedback. Domain unit tests run via `swift test`; this
  # scheme covers the app build + UI smoke.
  PegGameIdleCI:
    build:
      targets:
        PegGameIdle: all
    test:
      targets:
        - PegGameIdleUITests
