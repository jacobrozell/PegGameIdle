name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Domain tests + app build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # XcodeGen emits the Xcode 16 project format, so pin a matching toolchain
      # rather than the runner's older default (Xcode 15.4 can't read format 77).
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      # Pure domain logic (PegGameDomain) — fast, simulator-free.
      - name: Run domain tests
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Pick an available iPhone simulator on the runner (names vary by Xcode).
      - name: Choose simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next((dev['name'] for r in d for dev in d[r] if dev.get('isAvailable') and 'iPhone' in dev['name']), ''))")
          echo "Using simulator: ${NAME:-<none found>}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Build the app and run the hosted unit tests (core features + drag).
      - name: Build & test app
        run: |
          xcodebuild test \
            -scheme PegGameIdleCI \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO
