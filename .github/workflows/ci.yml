name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Domain tests + app build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # XcodeGen emits the Xcode 16 project format, so pin a matching toolchain
      # rather than the runner's older default (Xcode 15.4 can't read format 77).
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      # Pure domain logic (PegGameDomain) — fast, simulator-free.
      - name: Run domain tests
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Compile the iOS app (no signing, no test run yet) to catch build drift.
      - name: Build app
        run: |
          xcodebuild build \
            -scheme PegGameIdleCI \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
